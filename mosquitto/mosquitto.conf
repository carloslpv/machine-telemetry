listener 1883

# every client logs in, and the ACL limits each gateway to its own site
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl

# the platform's persistent session survives a broker restart, with what was queued for it
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# messages queued for the platform while it is down: two machines send about 13 messages a minute, so 100000 is
# more than four days. The default (1000) would start dropping after an hour.
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
