apiVersion: 1
datasources:
  - name: Telemetria
    uid: telemetry
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: telemetry
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
    isDefault: true
